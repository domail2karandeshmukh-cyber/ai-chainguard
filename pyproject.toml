[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chainguard"
version = "0.1.0"
description = "AI-ChainGuard: AI Supply Chain Integrity & Attestation Platform (ESAIP M1 prototype)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Karan DESHMUKH" },
    { name = "JOGI Sudheer reddy" },
    { name = "DAMA Dola Krishna" },
    { name = "MEKALA Rambabu" },
]
license = { text = "MIT" }

[project.scripts]
chainguard = "cli.main:app"

[tool.setuptools.packages.find]
include = ["chainguard*", "cli*", "api*", "ml_pipeline*", "deployment*", "attacks*", "dashboard*", "scripts*"]

[tool.setuptools.package-data]
chainguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: trains real models (deselect with -m 'not slow')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 = assert (used in tests), S603/S607 = subprocess calls to git (trusted, fixed args)
ignore = ["S101", "S603", "S607", "E501", "B008", "UP042"]
# B008: Depends()/typer.Option() defaults are the FastAPI/Typer idiom; UP042: (str, Enum) kept for clarity

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"attacks/**" = ["S311"]
